# Banco MySQL 8.4 do SombraSP. Uso: cp .env.example .env  (troque as senhas)  &&  docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: sombrasp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: sombrasp
      MYSQL_USER: sombrasp
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - sombrasp-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  sombrasp-mysql-data:
