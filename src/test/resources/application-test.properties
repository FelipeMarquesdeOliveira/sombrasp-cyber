# Testes automatizados: H2 em memória no modo MySQL, com as MESMAS migrations do Flyway.
spring.datasource.url=jdbc:h2:mem:sombrasp-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

api.security.token.secret=segredo-exclusivo-dos-testes-automatizados-sombrasp-0123456789
logging.level.br.com.fiap3esph.sombrasp=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.flywaydb=WARN

# Cybersecurity: chave de teste, IA desligada (sem rede) e eventos na mesma thread.
sombrasp.pii.chave=dGVzdGUtc29tYnJhc3AtY2hhdmUtZGUtMzItYnl0ZXMhIQ==
sombrasp.ia.habilitada=false
sombrasp.ia.minimax.chave=
sombrasp.eventos.sincrono=true
