spring.application.name=sombrasp-cyber
server.port=8086

# Segredos locais: o arquivo .env (fora do Git) é lido como propriedades.
spring.config.import=optional:file:.env[.properties]

# ---------------------------------------------------------------------------
# Banco MySQL (container Docker "sombrasp-cyber-mysql", porta 3307). A senha NUNCA fica no código:
# vem da variável de ambiente DB_PASSWORD (veja o README e o .env.example).
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/sombrasp_cyber}
spring.datasource.username=${DB_USER:sombrasp}
spring.datasource.password=${DB_PASSWORD:}

# A estrutura do banco é criada e versionada SOMENTE pelo Flyway (db/migration).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# ---------------------------------------------------------------------------
# JWT: em produção defina JWT_SECRET; o valor abaixo serve só para rodar localmente.
# ---------------------------------------------------------------------------
api.security.token.secret=${JWT_SECRET:sombrasp-segredo-de-desenvolvimento-local-troque-em-producao}
api.security.token.validade-horas=2

# Documentação automática
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

server.error.include-stacktrace=never
server.error.include-message=never

# ---------------------------------------------------------------------------
# Cybersecurity (GS 2026.2): PII, Taint Analysis, IA e painel de Risco Cidadão
# ---------------------------------------------------------------------------
# Chave mestra dos dados pessoais (Base64, 32 bytes). Sem ela a aplicação não sobe.
sombrasp.pii.chave=${PII_CHAVE:}

# LLM que traduz o evento técnico para o cidadão (API compatível com chat completions).
sombrasp.ia.habilitada=true
sombrasp.ia.minimax.url=https://api.minimax.io/v1
sombrasp.ia.minimax.modelo=MiniMax-M3.1-Flash
sombrasp.ia.minimax.chave=${MINIMAX_API_KEY:}
sombrasp.ia.timeout-segundos=25

# Farol: considera os eventos dos últimos N minutos.
sombrasp.risco.janela-minutos=60

# Endpoints com erros simulados de propósito (demonstração). Em produção: false.
sombrasp.laboratorio.habilitado=true
