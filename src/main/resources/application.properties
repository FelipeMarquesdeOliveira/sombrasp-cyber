spring.application.name=sombrasp-soa
server.port=8085

# ---------------------------------------------------------------------------
# Banco MySQL (container Docker "sombrasp-mysql"). A senha NUNCA fica no código:
# vem da variável de ambiente DB_PASSWORD (veja o README e o .env.example).
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sombrasp}
spring.datasource.username=${DB_USER:sombrasp}
spring.datasource.password=${DB_PASSWORD:}

# A estrutura do banco é criada e versionada SOMENTE pelo Flyway (db/migration).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# ---------------------------------------------------------------------------
# JWT: em produção defina JWT_SECRET; o valor abaixo serve só para rodar localmente.
# ---------------------------------------------------------------------------
api.security.token.secret=${JWT_SECRET:sombrasp-segredo-de-desenvolvimento-local-troque-em-producao}
api.security.token.validade-horas=2

# Documentação automática
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

server.error.include-stacktrace=never
server.error.include-message=never
